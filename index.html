<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>
<style>
  /* Optimizacion E-ink: Solo Blanco y Negro puro, bordes solidos */
  body { font-family: Georgia, serif; background: #ffffff; color: #000000; margin: 0; padding: 8px; font-size: 16px; }
  h2 { font-size: 18px; margin: 4px 0 10px 0; border-bottom: 2px solid #000; padding-bottom: 4px; }
  .section { border: 2px solid #000; padding: 8px; margin-bottom: 10px; background: #ffffff; }
  .section label { display: block; font-size: 13px; margin-bottom: 4px; font-weight: bold; }
  input[type=password], input[type=text] { width: 100%; font-size: 13px; padding: 4px; box-sizing: border-box; border: 2px solid #000; }
  .section-status { font-size: 12px; margin-top: 4px; font-style: italic; }
  #instructions { width: 100%; height: 70px; font-size: 14px; font-family: Georgia, serif; padding: 6px; box-sizing: border-box; border: 2px solid #000; resize: none; }
  #file-list { margin-top: 6px; border: 2px solid #000; padding: 4px; min-height: 30px; font-size: 13px; }
  .file-item { padding: 6px 4px; border-bottom: 1px solid #000; cursor: pointer; }
  .file-item.selected { background: #000; color: #fff; }
  .file-item:last-child { border-bottom: none; }
  #loaded-files { font-size: 12px; margin-top: 4px; font-style: italic; font-weight: bold; }
  #input-area { border: 3px solid #000; padding: 8px; margin-bottom: 10px; }
  #userinput { width: 100%; height: 60px; font-size: 15px; font-family: Georgia, serif; padding: 6px; box-sizing: border-box; border: 2px solid #000; resize: none; }
  #btn-row { margin-top: 4px; }
  button { font-size: 15px; padding: 8px 16px; margin-right: 6px; margin-bottom: 4px; border: 2px solid #000; background: #fff; color: #000; cursor: pointer; font-family: Georgia, serif; font-weight: bold; }
  .small-btn { font-size: 12px; padding: 4px 8px; }
  .toggle-on { background: #000; color: #fff; }
  #status { font-size: 13px; font-style: italic; margin-top: 4px; min-height: 16px; font-weight: bold; }
  .msg-user { margin-bottom: 8px; padding: 6px; border: 2px solid #000; }
  .msg-ai { margin-bottom: 8px; padding: 6px; border: 2px solid #000; border-left: 6px solid #000; }
  .msg-label { font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 3px; }
  .nav-row { text-align: center; padding: 8px 4px; margin: 10px 0; border-top: 2px solid #000; border-bottom: 2px solid #000; }
  .nav-row a { display: inline-block; padding: 8px 18px; margin: 0 6px; border: 2px solid #000; background: #fff; color: #000; text-decoration: none; font-size: 15px; font-weight: bold; }
  #ai-selector button { font-size: 13px; padding: 6px 12px; margin-right: 4px; margin-bottom: 4px; }
</style>
</head>
<body>

<a name="top"></a>
<h2>AI Chat Kindle (Optimizado)</h2>

<div class="section">
  <label>URL de Guardado (Marca páginas):</label>
  <div id="bookmark-url" style="font-size:11px;padding:4px;border:1px solid #000;word-break:break-all;">Cargando...</div>
</div>

<div class="section">
  <label>IA Activa:</label>
  <div id="ai-selector">
    <button id="btn-groq" class="toggle-on" onclick="selectAI('groq')">Groq</button>
    <button id="btn-gemini" onclick="selectAI('gemini')">Gemini</button>
    <button id="btn-nvidia" onclick="selectAI('nvidia')">NVIDIA</button>
  </div>
  <div class="section-status" id="ai-status">Usando Groq</div>
</div>

<div class="section">
  <label>Groq API Key:</label>
  <input type="password" id="apikey" placeholder="gsk_..." />
  <label style="margin-top:8px;">Gemini API Key:</label>
  <input type="password" id="geminikey" placeholder="AIza..." />
  <label style="margin-top:8px;">NVIDIA API Key:</label>
  <input type="password" id="nvidiakey" placeholder="nvapi-..." />
  <label style="margin-top:8px;">GitHub Token (Opcional):</label>
  <input type="password" id="ghtoken" placeholder="ghp_..." />
  <button class="small-btn" onclick="updateBookmarkUrl()" style="margin-top:8px;">Actualizar Marca páginas</button>
</div>

<div class="section">
  <label>Archivos GitHub (docs/):</label>
  <button class="small-btn" onclick="loadFileList()">Cargar archivos</button>
  <div id="file-list">Toca para cargar.</div>
  <div id="loaded-files"></div>
</div>

<div class="section">
  <label>Instrucciones de la IA:</label>
  <textarea id="instructions"></textarea>
  <button class="small-btn toggle-on" id="toggle-btn" onclick="toggleInstructions()" style="margin-top:6px;">Instrucciones: ON</button>
</div>

<div id="input-area">
  <a name="input"></a>
  <textarea id="userinput" placeholder="Escribe aquí..."></textarea>
  <div id="btn-row">
    <button onclick="sendMessage()">Enviar</button>
    <button onclick="clearChat()">Limpiar</button>
  </div>
  <div id="status"></div>
</div>

<div id="chat">Historial...</div>
<a name="bottom"></a>

<script>
var chatHistory = [];
var instructionsOn = true;
var loadedFiles = {};
var selectedFiles = [];
var activeAI = "groq";

var GITHUB_USER = "dantepicachu11-coder";
var GITHUB_REPO = "AI-for-Kindle";
var GITHUB_FOLDER = "docs";

var DEFAULT_INSTRUCTIONS = "Eres un asistente util. Responde corto y directo para ser leido en una pantalla pequeña de Kindle.";

// URL Proxy para evitar el Error 0 (CORS) sin crear cuentas
var PROXY_URL = "https://corsproxy.io/?"; 

function getParam(name) {
  var search = window.location.search;
  if (!search) return "";
  var pairs = search.substring(1).split("&");
  for (var i = 0; i < pairs.length; i++) {
    var pair = pairs[i].split("=");
    if (decodeURIComponent(pair[0]) === name) return pair[1] ? decodeURIComponent(pair[1]) : "";
  }
  return "";
}

function updateBookmarkUrl() {
  var gk = document.getElementById("apikey").value.trim();
  var gem = document.getElementById("geminikey").value.trim();
  var nv = document.getElementById("nvidiakey").value.trim();
  var gh = document.getElementById("ghtoken").value.trim();
  var base = window.location.href.split("?")[0].split("#")[0];
  var params = [];
  if (gk) params[params.length] = "gk=" + encodeURIComponent(gk);
  if (gem) params[params.length] = "gem=" + encodeURIComponent(gem);
  if (nv) params[params.length] = "nv=" + encodeURIComponent(nv);
  if (gh) params[params.length] = "gh=" + encodeURIComponent(gh);
  params[params.length] = "ai=" + encodeURIComponent(activeAI);
  document.getElementById("bookmark-url").innerHTML = base + (params.length > 0 ? "?" + params.join("&") : "");
}

window.onload = function() {
  var gk = getParam("gk"); var gem = getParam("gem"); var nv = getParam("nv"); var gh = getParam("gh"); var ai = getParam("ai");
  if (gk) document.getElementById("apikey").value = gk;
  if (gem) document.getElementById("geminikey").value = gem;
  if (nv) document.getElementById("nvidiakey").value = nv;
  if (gh) document.getElementById("ghtoken").value = gh;
  if (ai === "gemini" || ai === "nvidia") activeAI = ai;
  document.getElementById("instructions").value = DEFAULT_INSTRUCTIONS;
  updateAIButtons();
  updateBookmarkUrl();
};

function selectAI(ai) {
  activeAI = ai; chatHistory = []; document.getElementById("chat").innerHTML = '';
  updateAIButtons(); updateBookmarkUrl();
}

function updateAIButtons() {
  var ids = ["btn-groq", "btn-gemini", "btn-nvidia"];
  var ais = ["groq", "gemini", "nvidia"];
  for (var i = 0; i < ids.length; i++) document.getElementById(ids[i]).className = (activeAI === ais[i]) ? "toggle-on" : "";
  document.getElementById("ai-status").innerHTML = "Usando " + activeAI.toUpperCase();
}

function loadFileList() {
  var token = document.getElementById("ghtoken").value.trim();
  var listDiv = document.getElementById("file-list");
  listDiv.innerHTML = "Cargando...";
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "https://api.github.com/repos/" + GITHUB_USER + "/" + GITHUB_REPO + "/contents/" + GITHUB_FOLDER, true);
  xhr.setRequestHeader("Accept", "application/vnd.github.v3+json");
  if (token) xhr.setRequestHeader("Authorization", "token " + token);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status === 200) {
      var files = JSON.parse(xhr.responseText);
      listDiv.innerHTML = "";
      for (var i = 0; i < files.length; i++) {
        if (files[i].type === "file") {
          var item = document.createElement("div");
          item.className = "file-item"; item.innerHTML = files[i].name; item.setAttribute("data-name", files[i].name);
          item.onclick = (function(f) { return function() { toggleFileSelection(this, f.name); }; })(files[i]);
          listDiv.appendChild(item);
        }
      }
    } else { listDiv.innerHTML = "Error " + xhr.status; }
  };
  xhr.send();
}

function toggleFileSelection(item, name) {
  var idx = selectedFiles.indexOf(name);
  if (idx === -1) {
    item.innerHTML = name + " (cargando...)";
    var token = document.getElementById("ghtoken").value.trim();
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "https://api.github.com/repos/" + GITHUB_USER + "/" + GITHUB_REPO + "/contents/" + GITHUB_FOLDER + "/" + encodeURIComponent(name), true);
    xhr.setRequestHeader("Accept", "application/vnd.github.v3+json");
    if (token) xhr.setRequestHeader("Authorization", "token " + token);
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200) {
        var resp = JSON.parse(xhr.responseText);
        loadedFiles[name] = atob(resp.content.replace(/\n/g, ""));
        selectedFiles[selectedFiles.length] = name;
        item.className = "file-item selected"; item.innerHTML = name + " (listo)";
        document.getElementById("loaded-files").innerHTML = "Archivos: " + selectedFiles.join(", ");
      } else { item.innerHTML = name + " (error)"; }
    };
    xhr.send();
  } else {
    selectedFiles.splice(idx, 1); delete loadedFiles[name];
    item.className = "file-item"; item.innerHTML = name;
    document.getElementById("loaded-files").innerHTML = selectedFiles.length > 0 ? "Archivos: " + selectedFiles.join(", ") : "";
  }
}

function toggleInstructions() {
  instructionsOn = !instructionsOn;
  var btn = document.getElementById("toggle-btn");
  if (instructionsOn) { btn.innerHTML = "Instrucciones: ON"; btn.className = "small-btn toggle-on"; }
  else { btn.innerHTML = "Instrucciones: OFF"; btn.className = "small-btn"; }
}

function setStatus(msg) { document.getElementById("status").innerHTML = msg; }
function moveBottom() { var b = document.getElementsByName("bottom")[0]; if(b){b.parentNode.removeChild(b); document.body.appendChild(b);} }

function appendMessage(role, text) {
  var chat = document.getElementById("chat");
  var div = document.createElement("div");
  div.className = role === "user" ? "msg-user" : "msg-ai";
  div.innerHTML = "<div class='msg-label'>" + (role === "user" ? "Tú" : "IA") + "</div><div>" + text.replace(/</g, "&lt;").replace(/\n/g, "<br>") + "</div>";
  chat.appendChild(div);
  
  // Limite DOM: Solo mantiene los ultimos 10 elementos visuales (5 turnos de chat)
  while(chat.childNodes.length > 10) { chat.removeChild(chat.firstChild); }
  moveBottom();
}

function getSystemPrompt() {
  var sys = instructionsOn ? document.getElementById("instructions").value.trim() : "";
  if (selectedFiles.length > 0) {
    sys += "\n\nCONTEXTO DE ARCHIVOS ADJUNTOS:\n";
    for (var i = 0; i < selectedFiles.length; i++) sys += "Archivo [" + selectedFiles[i] + "]:\n" + loadedFiles[selectedFiles[i]] + "\n\n";
    sys += "Usa este contexto para responder si es necesario.";
  }
  return sys;
}

// Limite RAM: Corta el historial para recordar solo ultimos 6 mensajes
function pruneHistory() {
  if (chatHistory.length > 6) { chatHistory = chatHistory.slice(chatHistory.length - 6); }
}

function sendMessage() {
  var text = document.getElementById("userinput").value.trim();
  if (!text) return;
  chatHistory[chatHistory.length] = { role: "user", content: text };
  appendMessage("user", text);
  document.getElementById("userinput").value = "";
  setStatus("Enviando (Proxy)...");
  pruneHistory();
  
  if (activeAI === "groq") sendGroq();
  else if (activeAI === "gemini") sendGemini();
  else if (activeAI === "nvidia") sendNvidia();
}

function sendGroq() {
  var key = document.getElementById("apikey").value.trim();
  if (!key) { setStatus("Falta llave Groq"); return; }
  var msgs = []; var sys = getSystemPrompt(); if (sys) msgs[0] = { role: "system", content: sys };
  for (var i = 0; i < chatHistory.length; i++) msgs[msgs.length] = chatHistory[i];
  
  var xhr = new XMLHttpRequest();
  xhr.open("POST", PROXY_URL + encodeURIComponent("https://api.groq.com/openai/v1/chat/completions"), true);
  xhr.setRequestHeader("Content-Type", "application/json");
  xhr.setRequestHeader("Authorization", "Bearer " + key);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status === 200) {
      var reply = JSON.parse(xhr.responseText).choices[0].message.content;
      chatHistory[chatHistory.length] = { role: "assistant", content: reply };
      appendMessage("ai", reply); setStatus("");
    } else { setStatus("Error " + xhr.status + " (Revisa tu conexion)"); }
  };
  xhr.send(JSON.stringify({ model: "llama-3.1-70b-versatile", messages: msgs }));
}

function sendNvidia() {
  var key = document.getElementById("nvidiakey").value.trim();
  if (!key) { setStatus("Falta llave NVIDIA"); return; }
  var msgs = []; var sys = getSystemPrompt(); if (sys) msgs[0] = { role: "system", content: sys };
  for (var i = 0; i < chatHistory.length; i++) msgs[msgs.length] = chatHistory[i];
  
  var xhr = new XMLHttpRequest();
  xhr.open("POST", PROXY_URL + encodeURIComponent("https://integrate.api.nvidia.com/v1/chat/completions"), true);
  xhr.setRequestHeader("Content-Type", "application/json");
  xhr.setRequestHeader("Authorization", "Bearer " + key);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status === 200) {
      var reply = JSON.parse(xhr.responseText).choices[0].message.content;
      chatHistory[chatHistory.length] = { role: "assistant", content: reply };
      appendMessage("ai", reply); setStatus("");
    } else { setStatus("Error " + xhr.status + " (CORS Proxy/API)"); }
  };
  xhr.send(JSON.stringify({ model: "meta/llama-3.1-70b-instruct", max_tokens: 1024, messages: msgs }));
}

function sendGemini() {
  var key = document.getElementById("geminikey").value.trim();
  if (!key) { setStatus("Falta llave Gemini"); return; }
  var sys = getSystemPrompt(); var contents = [];
  for (var i = 0; i < chatHistory.length; i++) {
    var txt = chatHistory[i].content;
    if (i === 0 && sys) txt = sys + "\n\n" + txt;
    contents[contents.length] = { role: chatHistory[i].role === "assistant" ? "model" : "user", parts: [{ text: txt }] };
  }
  
  var xhr = new XMLHttpRequest();
  var targetUrl = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + key;
  xhr.open("POST", PROXY_URL + encodeURIComponent(targetUrl), true);
  xhr.setRequestHeader("Content-Type", "application/json");
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status === 200) {
      var reply = JSON.parse(xhr.responseText).candidates[0].content.parts[0].text;
      chatHistory[chatHistory.length] = { role: "assistant", content: reply };
      appendMessage("ai", reply); setStatus("");
    } else { setStatus("Error " + xhr.status); }
  };
  xhr.send(JSON.stringify({ contents: contents }));
}

function clearChat() { chatHistory = []; document.getElementById("chat").innerHTML = ''; setStatus("Limpio."); }
</script>
</body>
</html>
