<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Chat for Kindle</title>
  <style>
    body { font-family: serif; background: #fff; color: #000; font-size: 16px; margin: 0; padding: 5px; }
    h2 { font-size: 18px; margin: 4px 0 8px 0; }
    .section { border: 1px solid #000; padding: 8px; margin-bottom: 10px; }
    label { display: block; font-size: 13px; margin-bottom: 2px; }
    input, textarea { font-size: 14px; width: 98%; }
    button { font-size: 16px; padding: 3px 10px; margin: 3px 4px 3px 0; }
    #chat { border: 1px solid #888; min-height:30px; padding:5px; background:#fafafa; margin-bottom:5px;}
    .msg-user { color: #004; border-left: 3px solid #000; background: #eef; margin-bottom: 3px; padding-left: 3px;}
    .msg-ai { color: #333; border-left: 3px solid #888; background: #fff; margin-bottom: 3px; padding-left: 3px;}
    #status { font-size: 12px; color: #444; margin-top: 2px; }
  </style>
</head>
<body>
  <h2>AI Chat (Kindle)</h2>

  <div class="section" id="login-panel">
    <form id="loginform" onsubmit="return doLogin();">
      <label>Username:</label>
      <input id="username" name="username" autocomplete="username">
      <label>Password:</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <div id="login-status"></div>
      <button type="submit">Sign In</button>
    </form>
  </div>

  <div class="section" id="chat-panel" style="display:none;">
    <button onclick="doLogout()">Logout</button>
    <div id="apikey-section" style="display:none;">
      <label>Groq API Key:</label>
      <input id="apikey" type="text" readonly>
    </div>
    <label>Type your message:</label>
    <textarea id="userinput" rows="2"></textarea>
    <button onclick="sendMessage()">Send</button>
    <button onclick="clearChat()">Clear chat</button>
    <div id="status"></div>
    <div id="chat"><span style="color:#777;font-size:13px;">Messages will appear here.</span></div>
  </div>

<script type="text/javascript">
// Declare users right in the JS
var USERS = [
  {
    username: "alice",
    password: "wonder",
    apiKey: "gsk_123abc",
    ghToken: "ghp_abc123"
  },
  {
    username: "bob",
    password: "builder",
    apiKey: "gsk_456def",
    ghToken: "ghp_def456"
  }
];

// Polyfill for localStorage for some Kindle browsers:
window._storage = {};
var localStorage = window.localStorage || {
  setItem: function(k, v) { window._storage[k] = v; },
  getItem: function(k) { return window._storage[k] || null; },
  removeItem: function(k) { delete window._storage[k]; }
};

window.onload = function() {
  var apikey = localStorage.getItem("groq_key");
  if (apikey) showChatPanel(apikey);
};

function doLogin() {
  var user = document.getElementById("username").value;
  var pass = document.getElementById("password").value;
  var loginStatus = document.getElementById("login-status");
  loginStatus.innerHTML = "";
  var found = null;
  for (var i=0; i<USERS.length; ++i) {
    if (USERS[i].username === user && USERS[i].password === pass) {
      found = USERS[i];
      break;
    }
  }
  if (found) {
    localStorage.setItem("groq_key", found.apiKey);
    localStorage.setItem("gh_token", found.ghToken);
    showChatPanel(found.apiKey);
    return false;
  } else {
    loginStatus.innerHTML = "<span style='color:#a00;'>Wrong username or password.</span>";
    return false;
  }
}

function showChatPanel(apikey) {
  document.getElementById("login-panel").style.display = "none";
  document.getElementById("chat-panel").style.display = "";
  document.getElementById("apikey-section").style.display = "";
  document.getElementById("apikey").value = apikey || "";
}

function doLogout() {
  localStorage.removeItem("groq_key");
  localStorage.removeItem("gh_token");
  document.getElementById("login-panel").style.display = "";
  document.getElementById("chat-panel").style.display = "none";
}

function sendMessage() {
  var input = document.getElementById("userinput").value;
  if (!input) {
    setStatus("Type something!");
    return;
  }
  appendMessage("user", input);
  setStatus("Thinking...");
  // Demo: Echo result after 2 seconds.
  setTimeout(function() {
    appendMessage("ai", "This is a demo AI reply to: " + input);
    setStatus("");
  }, 2000);
  document.getElementById("userinput").value = "";
}

function clearChat() {
  document.getElementById("chat").innerHTML = "<span style='color:#777;font-size:13px;'>Messages will appear here.</span>";
}

function appendMessage(role, text) {
  var chat = document.getElementById("chat");
  var div = document.createElement("div");
  div.className = role === "user" ? "msg-user" : "msg-ai";
  div.innerHTML = (role === "user" ? "You: " : "AI: ") + escapeHtml(text);
  chat.appendChild(div);
}

function setStatus(msg) {
  document.getElementById("status").innerHTML = msg;
}

function escapeHtml(s) {
  return (s+"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
</body>
</html>
