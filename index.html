<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Chat for Kindle</title>
  <style>
    body { font-family: serif; background: #fff; color: #000; font-size: 16px; margin: 0; padding: 5px; }
    h2 { font-size: 18px; margin: 4px 0 8px 0; }
    .section { border: 1px solid #000; padding: 8px; margin-bottom: 10px; }
    label { display: block; font-size: 13px; margin-bottom: 2px; }
    input, textarea { font-size: 14px; width: 98%; }
    button { font-size: 16px; padding: 3px 10px; margin: 3px 4px 3px 0; }
    #chat { border: 1px solid #888; min-height:30px; padding:5px; background:#fafafa; margin-bottom:5px;}
    .msg-user { color: #004; border-left: 3px solid #000; background: #eef; margin-bottom: 3px; padding-left: 3px;}
    .msg-ai { color: #333; border-left: 3px solid #888; background: #fff; margin-bottom: 3px; padding-left: 3px;}
    #status { font-size: 12px; color: #444; margin-top: 2px; }
    #apikey-section { margin-bottom: 10px; }
    #ghtoken-section { margin-bottom: 10px; }
  </style>
</head>
<body>
  <h2>AI Chat (Kindle)<br>
      <span style="font-size:13px;">(No login, API key is built in)</span></h2>

  <div class="section" id="apikey-section" style="display:none">
    <label>Groq API Key (readonly demo):</label>
    <input id="apikey" type="text" readonly>
  </div>
  <div class="section" id="ghtoken-section" style="display:none">
    <label>GitHub Token (readonly demo):</label>
    <input id="ghtoken" type="text" readonly>
  </div>

  <div class="section">
    <label>Type your message:</label>
    <textarea id="userinput" rows="2"></textarea>
    <button onclick="sendMessage()">Send</button>
    <button onclick="clearChat()">Clear chat</button>
    <div id="status"></div>
    <div id="chat"><span style="color:#777;font-size:13px;">Messages will appear here.</span></div>
  </div>

<script type="text/javascript">
var API_KEY = "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"; // This are test, non-working API
var GH_TOKEN = "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"; // This are test, non-working API

// Uncomment below if you want them visible for debugging
// window.onload = function() {
//   document.getElementById("apikey").value = API_KEY;
//   document.getElementById("ghtoken").value = GH_TOKEN;
// };

function sendMessage() {
  var input = document.getElementById("userinput").value;
  if (!input) {
    setStatus("Type something!");
    return;
  }
  appendMessage("user", input);
  setStatus("Talking to AI...");

  // Prepare chat history (simple, one user, one AI per go)
  var messages = [];
  var chatDiv = document.getElementById("chat");
  var divs = chatDiv.getElementsByTagName("div");
  for (var i=0; i<divs.length; ++i) {
    var txt = divs[i].innerText || divs[i].textContent;
    if (divs[i].className.indexOf("msg-user") !== -1) {
      messages.push({"role": "user", "content": txt.replace(/^You: /,"")});
    } else if (divs[i].className.indexOf("msg-ai") !== -1) {
      messages.push({"role": "assistant", "content": txt.replace(/^AI: /,"")});
    }
  }
  // Add current user input
  messages.push({"role": "user", "content": input});

  var xhr = new XMLHttpRequest();
  xhr.open("POST", "https://api.groq.com/openai/v1/chat/completions", true);
  xhr.setRequestHeader("Content-Type", "application/json");
  xhr.setRequestHeader("Authorization", "Bearer " + API_KEY);

  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      setStatus("");
      if (xhr.status === 200) {
        try {
          var resp = JSON.parse(xhr.responseText);
          var reply = resp.choices && resp.choices[0] && resp.choices[0].message && resp.choices[0].message.content
            ? resp.choices[0].message.content
            : "[No AI reply]";
          appendMessage("ai", reply);
        } catch(e) {
          appendMessage("ai", "[Parse error or unexpected response]");
        }
      } else {
        var errMsg = "Error: " + xhr.status + " - ";
        if (xhr.responseText) errMsg += xhr.responseText;
        appendMessage("ai", errMsg);
      }
    }
  };

  // You may change the model to any supported by Groq (example: "llama-3-8b-8192")
  var data = {
    model: "llama-3-8b-8192", // or "llama-3.1-8b-instant"
    messages: messages,
    max_tokens: 128
  };
  try {
    xhr.send(JSON.stringify(data));
  } catch(e) {
    setStatus("AJAX send error: " + e);
  }

  document.getElementById("userinput").value = "";
}

function clearChat() {
  document.getElementById("chat").innerHTML = "<span style='color:#777;font-size:13px;'>Messages will appear here.</span>";
}

function appendMessage(role, text) {
  var chat = document.getElementById("chat");
  // remove placeholder if exists
  if (chat.childNodes.length === 1 && chat.childNodes[0].nodeType === 1 && chat.childNodes[0].tagName === 'SPAN')
    chat.innerHTML = "";
  var div = document.createElement("div");
  div.className = role === "user" ? "msg-user" : "msg-ai";
  div.innerHTML = (role === "user" ? "You: " : "AI: ") + escapeHtml(text);
  chat.appendChild(div);
}

function setStatus(msg) {
  document.getElementById("status").innerHTML = msg;
}

function escapeHtml(s) {
  return (s+"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
</body>
</html>
